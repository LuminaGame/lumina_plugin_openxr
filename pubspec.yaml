name: lumina_plugin_openxr
description: "Khronos OpenXR plugin for Lumina Studio: cross-platform XR runtime management, native OpenXR loader bridge, HMD and controller tracking components, and stereoscopic rendering."
version: 0.1.0
publish_to: none
repository: https://github.com/LuminaGame/lumina_plugin_openxr

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  lumina_editor_api:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina_editor_api
      ref: 5981aeec85fa2d456323103656b5879784fd4458
  lumina_plugin_process:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina_plugin_process
      ref: 5981aeec85fa2d456323103656b5879784fd4458
  lumina:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina
      ref: 5981aeec85fa2d456323103656b5879784fd4458
  # The game host an immersive game presents through (runtime module).
  lumina_widgets:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina_widgets
      ref: 5981aeec85fa2d456323103656b5879784fd4458
  flutter_filament:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: flutter_filament
      ref: 5981aeec85fa2d456323103656b5879784fd4458
  lumina_core:
    git:
      url: https://github.com/LuminaGame/lumina.git
      path: lumina_core
      ref: 5981aeec85fa2d456323103656b5879784fd4458
  ffi: ^2.1.2
  vector_math: ^2.1.4
  meta: ^1.15.0
  logging: ^1.2.0
  hooks: ^1.0.0
  code_assets: ^1.0.0
  native_toolchain_c: ^0.17.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.0
  archive: ^4.2.0
  lumina_smoke:
    git:
      url: https://github.com/LuminaGame/tools.git
      path: lumina_smoke
      ref: 7f6b46c8379ae61e5dc80fe243eddf41b3ac8f3e

hooks:
  user_defines:
    flutter_filament:
      filament_dir: filament
    flutter_assimp:
      filament_dir: filament
      libcxx_dir: ../lumina/flutter_filament/third_party/libcxx
    flutter_riglogic:
      libcxx_dir: ../lumina/flutter_filament/third_party/libcxx
      riglogic_lib_dir: ../tools/flutter_riglogic/third_party/openriglogic/lib

flutter:
  plugin:
    platforms:
      # The Kotlin part hands the Activity to the native bridge (the OpenXR
      # loader and XR_KHR_android_create_instance need it). The bridge itself
      # is a native-assets code asset (hook/build.dart).
      android:
        package: com.lumina.openxr
        pluginClass: OpenXrPlugin
