include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - filament/**
    - test-assets/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Own-package files are imported by package URI, never by a relative path.
    always_use_package_imports: true
